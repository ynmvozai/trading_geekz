name: backtest-c
on:
  push:
    branches: [backtest-c]
    paths: [backtest/**, .github/workflows/backtest-c.yml]
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: backtest/datos
          key: velas-1m-2026-02-01-2026-10-23-v1
      - name: Bajar velas
        working-directory: backtest
        run: |
          if [ ! -f datos/NAS.csv.gz ]; then python3 descargar.py 2026-02-01 2026-10-23 2>&1 | grep -v Deprecation | tee descarga.log; fi
          ls -la datos
      - name: Correr estrategia C
        working-directory: backtest
        run: |
          set -o pipefail
          mkdir -p resultados
          python3 c.py datos resultados 2>&1 | tee resultados/log.txt
      - name: Resumen
        working-directory: backtest
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY; cat resultados/resumen.json >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Guardar resultados en la rama backtest-c-resultados
        run: |
          cp -r backtest/resultados /tmp/res && cp backtest/descarga.log /tmp/res/ 2>/dev/null || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan backtest-c-resultados && git rm -rqf . && cp -r /tmp/res/* .
          git add -A && git commit -qm "resultados estrategia C" && git push -f origin backtest-c-resultados
