name: backtest-f
on:
  push:
    branches: [backtest-c]
    paths: [backtest/f.py, backtest/descargar_f.py, .github/workflows/backtest-f.yml]
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: backtest/datos_f
          key: velas-f-1h-2022-01-2026-10-v1
      - name: Bajar velas de 1 hora
        working-directory: backtest
        run: |
          python3 descargar_f.py 2022-01 2026-10 2>&1 | tee descarga_f.log
          ls -la datos_f
      - name: Correr estrategia F
        working-directory: backtest
        run: |
          set -o pipefail
          mkdir -p resultados_f && cp descarga_f.log resultados_f/
          python3 f.py datos_f resultados_f 2>&1 | tee resultados_f/log.txt
      - name: Guardar resultados en la rama backtest-f-resultados
        if: always()
        run: |
          mkdir -p backtest/resultados_f && cp backtest/descarga_f.log backtest/resultados_f/ 2>/dev/null || true
          cp -r backtest/resultados_f /tmp/res
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan backtest-f-resultados && git rm -rqf . && rm -rf backtest .github && cp -r /tmp/res/* .
          git add -A && git commit -qm "resultados estrategia F" && git push -f origin backtest-f-resultados
