name: backtest-g
on:
  push:
    branches: [backtest-c]
    paths: [backtest/g.py, .github/workflows/backtest-g.yml]
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: backtest/datos_f
          key: velas-f-1h-2022-01-2026-10-v1
      - name: Bajar velas de 1 hora
        working-directory: backtest
        run: |
          python3 descargar_f.py 2022-01 2026-10 2>&1 | tee descarga_f.log
          ls -la datos_f
      - name: Correr estrategia G
        working-directory: backtest
        run: |
          set -o pipefail
          mkdir -p resultados_g && cp descarga_f.log resultados_g/
          python3 g.py datos_f resultados_g 2>&1 | tee resultados_g/log.txt
      - name: Guardar resultados en la rama backtest-g-resultados
        if: always()
        run: |
          mkdir -p backtest/resultados_g && cp backtest/descarga_f.log backtest/resultados_g/ 2>/dev/null || true
          cp -r backtest/resultados_g /tmp/res
          git config user.name "github-actions" && git config user.email "actions@github.com"
          mv backtest/datos_f /tmp/datos_f_keep
          git checkout --orphan backtest-g-resultados && git rm -rqf . && rm -rf backtest .github && cp -r /tmp/res/* .
          git add -A && git commit -qm "resultados estrategia G" && git push -f origin backtest-g-resultados
          mkdir -p backtest && mv /tmp/datos_f_keep backtest/datos_f
