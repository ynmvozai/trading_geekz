# Aviso de caída: cada 5 minutos revisa /health del servidor. Si falla 2 veces seguidas, avisa en #agent.
# Necesita el secreto WEBHOOK_AGENT (Settings → Secrets and variables → Actions) y la variable HOTZONE_URL.
name: Hot Zone monitor
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
concurrency: { group: hotzone-monitor, cancel-in-progress: false }
permissions: { actions: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revisar /health
        env:
          URL: ${{ vars.HOTZONE_URL || 'https://tradinggeekz-production.up.railway.app' }}
          HOOK: ${{ secrets.WEBHOOK_AGENT }}
          GH: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ -z "$URL" ] && { echo "Falta la variable HOTZONE_URL"; exit 0; }
          ok=0
          for i in 1 2; do
            code=$(curl -s -o body.json -w '%{http_code}' -m 20 "$URL/health" || echo 000)
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 60
          done
          if [ "$ok" = "1" ]; then echo "OK"; exit 0; fi
          msg="🔴 **Hot Zone no responde** (/health → HTTP $code). Si es 503: el servidor está vivo pero sin datos de Binance. Si es 000: el servidor está caído. Revisa Railway → Deployments."
          # Solo avisa en el primer fallo (no cada 5 minutos mientras siga caído).
          prev=$(curl -s -H "Authorization: Bearer $GH" "https://api.github.com/repos/$REPO/actions/workflows/hotzone-monitor.yml/runs?per_page=1&status=completed" | jq -r '.workflow_runs[0].conclusion // "none"')
          [ "$prev" != "failure" ] && [ -n "$HOOK" ] && curl -s -H 'Content-Type: application/json' -d "$(jq -n --arg c "$msg" '{content:$c}')" "$HOOK"
          exit 1
